<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 — Braun Andrus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: #f5f0e8;
      min-height: 100vh;
    }

    .site-nav {
      display: flex; justify-content: flex-end; padding: 1.2rem 2.5rem;
      background: #1a1a2e; gap: 2rem;
    }
    .site-nav a {
      color: #e8d5a3; text-decoration: none; font-weight: 700;
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .site-nav a:hover { opacity: 0.7; }

    .game-header {
      text-align: center;
      padding: 2rem 1rem 0.5rem;
    }
    .game-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      color: #1a1a2e;
      margin-bottom: 0.25rem;
    }
    .game-header p { color: #666; font-size: 1rem; }

    .score-area {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1rem auto;
    }
    .score-box {
      background: #bbada0;
      color: #fff;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      text-align: center;
      min-width: 90px;
    }
    .score-box .label { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
    .score-box .value { font-size: 1.4rem; font-weight: 700; font-family: 'Playfair Display', serif; }

    .controls {
      text-align: center;
      margin-bottom: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn-game {
      background: #8f7a66;
      color: #fff;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-game:hover { background: #6e5e50; }

    /* BOARD */
    .board-container {
      display: flex;
      justify-content: center;
      padding: 0 1rem 1rem;
    }
    .board-wrap {
      background: #bbada0;
      border-radius: 10px;
      padding: 12px;
      display: inline-block;
      touch-action: none;
      user-select: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .cell {
      width: 95px; height: 95px;
      background: rgba(238,228,218,0.35);
      border-radius: 6px;
    }
    .tile {
      width: 95px; height: 95px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2rem;
      transition: transform 0.08s ease;
    }
    .tile[data-v="2"]    { background:#eee4da; color:#776e65; }
    .tile[data-v="4"]    { background:#ede0c8; color:#776e65; }
    .tile[data-v="8"]    { background:#f2b179; color:#fff; }
    .tile[data-v="16"]   { background:#f59563; color:#fff; font-size:1.7rem; }
    .tile[data-v="32"]   { background:#f67c5f; color:#fff; font-size:1.7rem; }
    .tile[data-v="64"]   { background:#f65e3b; color:#fff; font-size:1.7rem; }
    .tile[data-v="128"]  { background:#edcf72; color:#fff; font-size:1.4rem; }
    .tile[data-v="256"]  { background:#edcc61; color:#fff; font-size:1.4rem; }
    .tile[data-v="512"]  { background:#edc850; color:#fff; font-size:1.4rem; }
    .tile[data-v="1024"] { background:#edc53f; color:#fff; font-size:1.1rem; }
    .tile[data-v="2048"] { background:#edc22e; color:#fff; font-size:1.1rem; }
    .tile-new { animation: pop 0.15s ease; }
    .tile-merge { animation: bounce 0.15s ease; }
    @keyframes pop { 0%{transform:scale(0)} 80%{transform:scale(1.1)} 100%{transform:scale(1)} }
    @keyframes bounce { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .overlay-box {
      background: #fff;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }
    .overlay-box h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 0.5rem; }
    .overlay-box p { color: #666; margin-bottom: 1.5rem; }

    .instructions {
      max-width: 450px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* Mobile arrow buttons */
    .arrow-controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 0 auto 1.5rem;
    }
    .arrow-row { display: flex; gap: 6px; }
    .arrow-btn {
      width: 52px; height: 52px;
      background: #8f7a66;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 520px) {
      .cell, .tile { width: 72px; height: 72px; }
      .tile { font-size: 1.4rem; }
      .tile[data-v="16"], .tile[data-v="32"], .tile[data-v="64"] { font-size: 1.2rem; }
      .tile[data-v="128"], .tile[data-v="256"], .tile[data-v="512"] { font-size: 1rem; }
      .tile[data-v="1024"], .tile[data-v="2048"] { font-size: 0.85rem; }
      .arrow-controls { display: flex; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html">Home</a>
  <a href="fitness.html">Fitness</a>
  <a href="game.html">Game Page</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="game-header">
  <h1>2048</h1>
  <p>Combine tiles to reach <strong>2048!</strong></p>
</div>

<div class="score-area">
  <div class="score-box">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="score-box">
    <div class="label">Best</div>
    <div class="value" id="best">0</div>
  </div>
</div>

<div class="controls">
  <button class="btn-game" onclick="initGame()">New Game</button>
  <button class="btn-game" onclick="undoMove()">Undo</button>
</div>

<div class="instructions">
  Use arrow keys (or swipe on mobile) to slide tiles. Tiles with the same number merge!
</div>

<div class="board-container">
  <div class="board-wrap">
    <div class="grid" id="grid">
      <!-- 16 cells generated by JS -->
    </div>
  </div>
</div>

<div class="arrow-controls">
  <div class="arrow-row"><button class="arrow-btn" onclick="move('up')">▲</button></div>
  <div class="arrow-row">
    <button class="arrow-btn" onclick="move('left')">◀</button>
    <button class="arrow-btn" onclick="move('down')">▼</button>
    <button class="arrow-btn" onclick="move('right')">▶</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-msg">No more moves available.</p>
    <button class="btn-game" onclick="initGame(); document.getElementById('overlay').classList.remove('show')">Play Again</button>
  </div>
</div>

<script>
  let board, score, best, prevBoard, prevScore;
  best = parseInt(localStorage.getItem('2048best') || '0');

  function initGame() {
    board = Array.from({length:4}, () => Array(4).fill(0));
    score = 0;
    prevBoard = null; prevScore = 0;
    addTile(); addTile();
    render();
  }

  function addTile() {
    const empty = [];
    board.forEach((row, r) => row.forEach((v, c) => { if (!v) empty.push([r,c]); }));
    if (!empty.length) return;
    const [r,c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r,c];
  }

  function render(newPos, mergedPos) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    // Background cells
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      grid.appendChild(cell);
    }
    // Overlay tiles (absolute not needed here; use grid positioning trick)
    grid.style.position = 'relative';
    board.forEach((row, r) => row.forEach((v, c) => {
      if (!v) return;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.v = v > 2048 ? 'high' : v;
      tile.textContent = v;
      tile.style.gridRow = r + 1;
      tile.style.gridColumn = c + 1;
      tile.style.position = 'absolute';
      const size = grid.querySelector('.cell').offsetWidth || 95;
      const gap = 10;
      tile.style.left = (c * (size + gap)) + 'px';
      tile.style.top = (r * (size + gap)) + 'px';
      tile.style.width = size + 'px';
      tile.style.height = size + 'px';
      if (newPos && newPos[0] === r && newPos[1] === c) tile.classList.add('tile-new');
      if (mergedPos && mergedPos.some(([mr,mc]) => mr===r && mc===c)) tile.classList.add('tile-merge');
      grid.appendChild(tile);
    }));
    document.getElementById('score').textContent = score;
    if (score > best) { best = score; localStorage.setItem('2048best', best); }
    document.getElementById('best').textContent = best;
  }

  function slideRow(row) {
    let arr = row.filter(v => v);
    let merged = [], mergedIdxs = [];
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i+1] && !merged[i]) {
        arr[i] *= 2; score += arr[i];
        arr.splice(i+1, 1); merged[i] = true;
        mergedIdxs.push(i);
      }
    }
    while (arr.length < 4) arr.push(0);
    return { row: arr, mergedIdxs };
  }

  function move(dir) {
    prevBoard = board.map(r => [...r]);
    prevScore = score;
    let changed = false, mergedPositions = [];

    const rotateRight = m => m[0].map((_,i) => m.map(r => r[i]).reverse());
    const rotateLeft  = m => m[0].map((_,i) => m.map(r => r[r.length-1-i]));

    if (dir === 'up')    board = rotateLeft(board);
    if (dir === 'down')  board = rotateRight(board);
    if (dir === 'right') board = board.map(r => [...r].reverse());

    board = board.map((row, r) => {
      const { row: newRow, mergedIdxs } = slideRow(row);
      if (newRow.join() !== row.join()) changed = true;
      mergedIdxs.forEach(c => mergedPositions.push([r, c]));
      return newRow;
    });

    if (dir === 'up')    board = rotateRight(board);
    if (dir === 'down')  board = rotateLeft(board);
    if (dir === 'right') board = board.map(r => [...r].reverse());

    let newPos = null;
    if (changed) { newPos = addTile(); }
    render(newPos, mergedPositions);

    if (hasWon()) showOverlay('You Win! 🎉', 'You reached 2048! Keep going or start fresh.');
    else if (!canMove()) showOverlay('Game Over', 'No more moves available. Final score: ' + score);
  }

  function hasWon() { return board.some(row => row.some(v => v === 2048)); }

  function canMove() {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      if (!board[r][c]) return true;
      if (c < 3 && board[r][c] === board[r][c+1]) return true;
      if (r < 3 && board[r][c] === board[r+1][c]) return true;
    }
    return false;
  }

  function undoMove() {
    if (!prevBoard) return;
    board = prevBoard.map(r => [...r]);
    score = prevScore;
    prevBoard = null;
    render();
  }

  function showOverlay(title, msg) {
    document.getElementById('overlay-title').textContent = title;
    document.getElementById('overlay-msg').textContent = msg;
    document.getElementById('overlay').classList.add('show');
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  // Touch/swipe
  let tx, ty;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, {passive:true});

  initGame();
</script>
</body>
</html>
