<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 — Braun Andrus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: #f5f0e8;
      min-height: 100vh;
      margin: 0;
    }
    .site-nav {
      display: flex; justify-content: flex-end; padding: 1.2rem 2.5rem;
      background: #1a1a2e; gap: 2rem;
    }
    .site-nav a {
      color: #e8d5a3; text-decoration: none; font-weight: 700;
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .site-nav a:hover { opacity: 0.7; }
    .game-header { text-align: center; padding: 2rem 1rem 0.5rem; }
    .game-header h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: #1a1a2e; margin-bottom: 0.25rem; }
    .game-header p { color: #666; font-size: 1rem; }
    .score-area { display: flex; justify-content: center; gap: 1rem; margin: 1rem auto; }
    .score-box { background: #bbada0; color: #fff; border-radius: 6px; padding: 0.5rem 1.2rem; text-align: center; min-width: 90px; }
    .score-box .label { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
    .score-box .value { font-size: 1.4rem; font-weight: 700; font-family: 'Playfair Display', serif; }
    .controls { text-align: center; margin-bottom: 1rem; display: flex; justify-content: center; gap: 0.75rem; }
    .btn-game { background: #8f7a66; color: #fff; border: none; padding: 0.5rem 1.5rem; border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .btn-game:hover { background: #6e5e50; }
    .instructions { max-width: 450px; margin: 0 auto 1.5rem; padding: 0 1rem; text-align: center; color: #888; font-size: 0.9rem; }
    .board-container { display: flex; justify-content: center; padding: 0 1rem 2rem; }
    .board-wrap { background: #bbada0; border-radius: 10px; padding: 12px; touch-action: none; user-select: none; }
    .grid { display: grid; grid-template-columns: repeat(4, 100px); grid-template-rows: repeat(4, 100px); gap: 10px; position: relative; width: 430px; height: 430px; }
    .cell { width: 100px; height: 100px; background: rgba(238,228,218,0.35); border-radius: 6px; }
    .tile {
      width: 100px; height: 100px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif; font-weight: 700; font-size: 2rem;
      position: absolute; transition: top 0.08s, left 0.08s;
    }
    .t2    { background:#eee4da; color:#776e65; }
    .t4    { background:#ede0c8; color:#776e65; }
    .t8    { background:#f2b179; color:#fff; }
    .t16   { background:#f59563; color:#fff; font-size:1.7rem; }
    .t32   { background:#f67c5f; color:#fff; font-size:1.7rem; }
    .t64   { background:#f65e3b; color:#fff; font-size:1.7rem; }
    .t128  { background:#edcf72; color:#fff; font-size:1.4rem; }
    .t256  { background:#edcc61; color:#fff; font-size:1.4rem; }
    .t512  { background:#edc850; color:#fff; font-size:1.4rem; }
    .t1024 { background:#edc53f; color:#fff; font-size:1.1rem; }
    .t2048 { background:#edc22e; color:#fff; font-size:1.1rem; }
    .thigh { background:#3c3a32; color:#fff; font-size:0.95rem; }
    @keyframes pop    { 0%{transform:scale(0)} 80%{transform:scale(1.12)} 100%{transform:scale(1)} }
    @keyframes bounce { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
    .tile-new   { animation: pop 0.18s ease forwards; }
    .tile-merge { animation: bounce 0.18s ease forwards; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; align-items:center; justify-content:center; }
    .overlay.show { display:flex; }
    .overlay-box { background:#fff; border-radius:12px; padding:2.5rem 3rem; text-align:center; max-width:340px; width:90%; }
    .overlay-box h2 { font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:0.5rem; }
    .overlay-box p  { color:#666; margin-bottom:1.5rem; }
    .arrow-controls { display:flex; flex-direction:column; align-items:center; gap:6px; margin:0 auto 1.5rem; }
    .arrow-row { display:flex; gap:6px; }
    .arrow-btn { width:54px; height:54px; background:#8f7a66; color:#fff; border:none; border-radius:8px; font-size:1.4rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .arrow-btn:active { background:#6e5e50; }
    @media(max-width:520px){
      .grid { grid-template-columns:repeat(4,72px); grid-template-rows:repeat(4,72px); width:318px; height:318px; }
      .cell,.tile { width:72px; height:72px; }
      .tile { font-size:1.4rem; }
      .t16,.t32,.t64 { font-size:1.2rem; }
      .t128,.t256,.t512 { font-size:1rem; }
      .t1024,.t2048,.thigh { font-size:0.85rem; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html">Home</a>
  <a href="fitness.html">Fitness</a>
  <a href="game.html">Game Page</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="game-header">
  <h1>2048</h1>
  <p>Combine tiles to reach <strong>2048!</strong></p>
</div>

<div class="score-area">
  <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
</div>

<div class="controls">
  <button class="btn-game" onclick="initGame()">New Game</button>
  <button class="btn-game" onclick="undoMove()">Undo</button>
</div>

<div class="instructions">Use arrow keys or the buttons below to slide tiles. Same numbers merge!</div>

<div class="board-container">
  <div class="board-wrap">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="arrow-controls">
  <div class="arrow-row"><button class="arrow-btn" onclick="move('up')">▲</button></div>
  <div class="arrow-row">
    <button class="arrow-btn" onclick="move('left')">◀</button>
    <button class="arrow-btn" onclick="move('down')">▼</button>
    <button class="arrow-btn" onclick="move('right')">▶</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-msg">No more moves available.</p>
    <button class="btn-game" onclick="initGame();document.getElementById('overlay').classList.remove('show')">Play Again</button>
  </div>
</div>

<script>
  const SIZE = window.innerWidth <= 520 ? 72 : 100;
  const GAP  = 10;

  let board, score, best, prevBoard, prevScore;
  best = parseInt(localStorage.getItem('2048best') || '0');
  document.getElementById('best').textContent = best;

  function initGame() {
    board = Array.from({length:4}, () => Array(4).fill(0));
    score = 0; prevBoard = null; prevScore = 0;
    spawn(); spawn();
    draw();
  }

  function spawn() {
    const empty = [];
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!board[r][c]) empty.push([r,c]);
    if (!empty.length) return null;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    board[r][c] = Math.random()<0.9 ? 2 : 4;
    return [r,c];
  }

  function px(i) { return i*(SIZE+GAP); }

  function draw(newCell, merged) {
    const grid = document.getElementById('grid');
    // Remove old tiles only (keep cells)
    grid.querySelectorAll('.tile').forEach(t => t.remove());
    // Add background cells if not there yet
    if (!grid.querySelector('.cell')) {
      for (let i=0;i<16;i++) {
        const d = document.createElement('div');
        d.className = 'cell'; grid.appendChild(d);
      }
    }
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
      if (!board[r][c]) continue;
      const v = board[r][c];
      const tile = document.createElement('div');
      tile.className = 'tile ' + (v<=2048 ? 't'+v : 'thigh');
      tile.textContent = v;
      tile.style.top  = px(r) + 'px';
      tile.style.left = px(c) + 'px';
      if (newCell && newCell[0]===r && newCell[1]===c) tile.classList.add('tile-new');
      if (merged  && merged.some(([mr,mc])=>mr===r&&mc===c)) tile.classList.add('tile-merge');
      grid.appendChild(tile);
    }
    document.getElementById('score').textContent = score;
    if (score > best) { best=score; localStorage.setItem('2048best',best); document.getElementById('best').textContent=best; }
  }

  function slideLeft(row) {
    let a = row.filter(v=>v), merged=[];
    for (let i=0;i<a.length-1;i++) {
      if (a[i]===a[i+1]) { a[i]*=2; score+=a[i]; a.splice(i+1,1); merged.push(i); }
    }
    while (a.length<4) a.push(0);
    return {row:a, merged};
  }

  function move(dir) {
    prevBoard = board.map(r=>[...r]); prevScore = score;
    let changed=false; const mergedPos=[];

    const T = m => m[0].map((_,c)=>m.map(r=>r[c]));

    let grid;
    if      (dir==='left')  grid = board.map(r=>[...r]);
    else if (dir==='right') grid = board.map(r=>[...r].reverse());
    else if (dir==='up')    grid = T(board);
    else                    grid = T(board).map(r=>[...r].reverse());

    grid = grid.map((row, i) => {
      const {row:slid, merged} = slideLeft(row);
      if (slid.join()!==row.join()) changed=true;
      merged.forEach(mi=>{
        const fi = (dir==='right'||dir==='down') ? 3-mi : mi;
        mergedPos.push(dir==='left'||dir==='right' ? [i,fi] : [fi,i]);
      });
      return (dir==='right'||dir==='down') ? slid.reverse() : slid;
    });

    if      (dir==='left'||dir==='right') board = grid;
    else if (dir==='up')                  board = T(grid);
    else                                  board = T(grid);

    const newCell = changed ? spawn() : null;
    draw(newCell, mergedPos);

    if (board.flat().includes(2048)) showOverlay('You Win! 🎉','You reached 2048! Keep going or start fresh.');
    else if (!canMove())             showOverlay('Game Over','No more moves! Final score: '+score);
  }

  function canMove() {
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
      if (!board[r][c]) return true;
      if (c<3 && board[r][c]===board[r][c+1]) return true;
      if (r<3 && board[r][c]===board[r+1][c]) return true;
    }
    return false;
  }

  function undoMove() {
    if (!prevBoard) return;
    board=prevBoard.map(r=>[...r]); score=prevScore; prevBoard=null; draw();
  }

  function showOverlay(title,msg) {
    document.getElementById('overlay-title').textContent=title;
    document.getElementById('overlay-msg').textContent=msg;
    document.getElementById('overlay').classList.add('show');
  }

  document.addEventListener('keydown', e=>{
    const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
    if (m[e.key]){e.preventDefault();move(m[e.key]);}
  });

  let tx=0,ty=0;
  document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if (Math.max(Math.abs(dx),Math.abs(dy))<25) return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  },{passive:true});

  initGame();
</script>
</body>
</html>
