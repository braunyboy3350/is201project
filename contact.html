<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Braun Andrus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Source Serif 4', Georgia, serif; color: #1a1a1a; }
    .site-nav {
      display: flex; justify-content: flex-end; padding: 1.2rem 2.5rem;
      background: #1a1a2e; gap: 2rem;
    }
    .site-nav a {
      color: #e8d5a3; text-decoration: none; font-weight: 700;
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .site-nav a:hover { opacity: 0.7; }

    .contact-hero {
      background: #1a1a2e;
      padding: 4rem 1.5rem;
      text-align: center;
      color: #e8d5a3;
    }
    .contact-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 0.5rem;
    }
    .contact-hero p { color: #aaa; font-size: 1.1rem; }

    .contact-body {
      max-width: 620px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    .contact-body h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #1a1a2e;
    }
    .form-label { font-size: 0.9rem; color: #555; font-family: Arial, sans-serif; }
    .form-control {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.7rem 1rem;
      font-family: 'Source Serif 4', serif;
      font-size: 1rem;
    }
    .form-control:focus { border-color: #1a1a2e; box-shadow: none; }
    .submit-btn {
      background: #1a1a2e;
      color: #e8d5a3;
      border: none;
      padding: 0.7rem 2.5rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Source Serif 4', serif;
      font-weight: 600;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #2e2e50; }

    .social-links {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #e5e5e5;
    }
    .social-links h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: #1a1a2e;
    }
    .social-links a {
      display: inline-block;
      margin-right: 1rem;
      margin-bottom: 0.5rem;
      color: #1a1a2e;
      text-decoration: none;
      font-size: 0.9rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 0.05em;
      padding: 0.4rem 1rem;
      border: 1.5px solid #1a1a2e;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .social-links a:hover { background: #1a1a2e; color: #e8d5a3; }

    footer {
      text-align: center; padding: 2rem 1rem;
      font-size: 0.85rem; color: #888; border-top: 1px solid #e5e5e5;
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html">Home</a>
  <a href="fitness.html">Fitness</a>
  <a href="game.html">Game Page</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="contact-hero">
  <h1>Contact Me</h1>
  <p>Get in touch — I'd love to hear from you.</p>
</div>

<div class="contact-body">
  <h2>Send a Message</h2>
  <form>
    <div class="mb-3">
      <label class="form-label">Your Name</label>
      <input type="text" class="form-control" placeholder="John Smith">
    </div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" placeholder="john@example.com">
    </div>
    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="5" placeholder="Write your message here..."></textarea>
    </div>
    <button type="submit" class="submit-btn">Send Message</button>
  </form>

  <div class="social-links">
    <h3>Find Me Online</h3>
    <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
    <a href="https://www.instagram.com" target="_blank">Instagram</a>
    <a href="https://github.com" target="_blank">GitHub</a>
  </div>
</div>

<footer>
  &copy; 2026 Braun Andrus
</footer>

</body>
</html>
